name: Keep API awake

# Pings the Render free-tier API every 5 minutes (and holds the run
# for ~4 minutes with extra pings) so it never falls asleep.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping for 4 minutes
        run: |
          for i in 1 2 3 4; do
            curl -sf -m 120 https://yourvibe-api.onrender.com/api/health || true
            sleep 55
          done
